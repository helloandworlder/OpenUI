name: Release OpenUI

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-linux-amd64:
    name: Linux amd64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend bundle
        run: |
          npm ci
          npm run build
        working-directory: frontend

      - name: Build OpenUI
        shell: bash
        run: |
          set -euo pipefail
          export CGO_ENABLED=1
          export GOOS=linux
          export GOARCH=amd64

          BOOTLIN_ARCH="x86-64"
          echo "Resolving Bootlin musl toolchain for ${BOOTLIN_ARCH}"
          TARBALL_BASE="https://toolchains.bootlin.com/downloads/releases/toolchains/${BOOTLIN_ARCH}/tarballs/"
          TARBALL_NAME="$(curl -fsSL "${TARBALL_BASE}" | grep -oE "${BOOTLIN_ARCH}--musl--stable-[^\"]+\\.tar\\.xz" | sort -r | head -n1)"
          test -n "${TARBALL_NAME}"
          cd /tmp
          curl -fL -sS -o "${TARBALL_NAME}" "${TARBALL_BASE}${TARBALL_NAME}"
          tar -xf "${TARBALL_NAME}"
          TOOLCHAIN_DIR="$(find . -maxdepth 1 -type d -name "${BOOTLIN_ARCH}--musl--stable-*" | head -n1)"
          export PATH="$(realpath "${TOOLCHAIN_DIR}")/bin:${PATH}"
          export CC="$(realpath "$(find "${TOOLCHAIN_DIR}/bin" -name '*-gcc.br_real' -type f -executable | head -n1)")"
          test -n "${CC}"
          cd -

          go build -ldflags "-w -s -linkmode external -extldflags '-static'" -o openui-release -v main.go
          file openui-release
          ldd openui-release || echo "Static binary confirmed"

          mkdir open-ui
          mv openui-release open-ui/open-ui
          cp open-ui.service.debian open-ui/
          cp open-ui.service.arch open-ui/
          cp open-ui.service.rhel open-ui/
          cp open-ui.rc open-ui/
          cp install.sh open-ui/install.sh
          cp open-ui.sh open-ui/open-ui.sh
          mkdir open-ui/bin

          XRAY_REPO="https://github.com/helloandworlder/Xray-core.git"
          XRAY_REF="openui-v26.5.9-rlimit.1"
          git clone --depth 1 --branch "${XRAY_REF}" "${XRAY_REPO}" /tmp/openui-xray-core
          (
            cd /tmp/openui-xray-core
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
              -o "${GITHUB_WORKSPACE}/open-ui/bin/xray-linux-amd64" \
              -trimpath \
              -buildvcs=false \
              -gcflags="all=-l=4" \
              -ldflags="-X github.com/xtls/xray-core/core.build=${XRAY_REF} -s -w -buildid=" \
              -v ./main
          )

          cd open-ui/bin
          wget -q https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat
          wget -q https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat
          wget -q -O geoip_IR.dat https://github.com/chocolate4u/Iran-v2ray-rules/releases/latest/download/geoip.dat
          wget -q -O geosite_IR.dat https://github.com/chocolate4u/Iran-v2ray-rules/releases/latest/download/geosite.dat
          wget -q -O geoip_RU.dat https://github.com/runetfreedom/russia-v2ray-rules-dat/releases/latest/download/geoip.dat
          wget -q -O geosite_RU.dat https://github.com/runetfreedom/russia-v2ray-rules-dat/releases/latest/download/geosite.dat

      - name: Package
        run: tar -zcvf open-ui-linux-amd64.tar.gz open-ui

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: open-ui-linux-amd64
          path: ./open-ui-linux-amd64.tar.gz

      - name: Upload release asset
        uses: svenstaro/upload-release-action@v2
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          file: open-ui-linux-amd64.tar.gz
          asset_name: open-ui-linux-amd64.tar.gz
          overwrite: true
